name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, privacy guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Install pnpm
        run: npm install -g "$(jq -r '.packageManager' package.json)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and lint
        run: pnpm exec vp check
      - name: Unused code
        run: pnpm exec vp run knip:check
      - name: i18n catalogs
        run: pnpm exec vp run i18n:check
      - name: Typecheck
        run: pnpm exec vp run typecheck

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [apps/server, apps/web, apps/desktop, packages]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Install pnpm
        run: npm install -g "$(jq -r '.packageManager' package.json)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for browser tests
        if: matrix.package == 'apps/web' || matrix.package == 'apps/server'
        run: pnpm --filter @t3tools/web exec playwright install --with-deps chromium
      - name: Test
        run: |
          if [ "${{ matrix.package }}" = packages ]; then
            for dir in packages/*/; do
              if jq -e '.scripts.test' "$dir/package.json" >/dev/null; then
                (cd "$dir" && pnpm run test) || exit 1
              fi
            done
          else
            cd "${{ matrix.package }}" && pnpm run test
          fi

  rust:
    name: Resource monitor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: native/resource-monitor
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo test --locked
