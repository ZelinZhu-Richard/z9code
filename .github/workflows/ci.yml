name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, privacy guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Install pnpm
        run: npm install -g "$(jq -r '.packageManager' package.json)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and lint
        run: pnpm exec vp check
      - name: No unlisted network hosts
        run: pnpm run check:egress
      - name: Unused code
        run: pnpm exec vp run knip:check
      - name: i18n catalogs
        run: pnpm exec vp run i18n:check
      - name: Typecheck
        run: pnpm exec vp run typecheck

  test:
    name: Test ${{ matrix.package }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One process per suite overloads a 4-vCPU runner and drops the browser; shard like upstream.
      matrix:
        include:
          - { package: apps/server, shard: 1/4 }
          - { package: apps/server, shard: 2/4 }
          - { package: apps/server, shard: 3/4 }
          - { package: apps/server, shard: 4/4 }
          - { package: apps/web, shard: 1/4 }
          - { package: apps/web, shard: 2/4 }
          - { package: apps/web, shard: 3/4 }
          - { package: apps/web, shard: 4/4 }
          - { package: apps/desktop, shard: 1/1 }
          - { package: packages, shard: 1/1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Install pnpm
        run: npm install -g "$(jq -r '.packageManager' package.json)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install native build libraries
        if: matrix.package == 'apps/desktop'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Install Chromium for browser tests
        if: matrix.package == 'apps/web' || matrix.package == 'apps/server'
        run: pnpm --filter @z9code/web exec playwright install --with-deps chromium
      - name: Test
        run: |
          if [ "${{ matrix.package }}" = packages ]; then
            for dir in packages/*/; do
              if jq -e '.scripts.test' "$dir/package.json" >/dev/null; then
                (cd "$dir" && pnpm run test) || exit 1
              fi
            done
          else
            cd "${{ matrix.package }}" && pnpm run test --shard "${{ matrix.shard }}"
          fi

  rust:
    name: Resource monitor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: native/resource-monitor
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo test --locked
